# The pipeline page is meant to be read as evidence, so the jobs are named as the claims they
# settle rather than as the commands they run, and the run ends by republishing the README's
# invariant table ticked from the test reports of every job.
#
# Standard runners only. A larger runner is the one documented way a public repository gets billed
# (docs/research/ci-and-testcontainers-budget.md section 1), so `runs-on` never says anything but
# `ubuntu-latest`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Three jobs in parallel: cheap failures come back in minutes without waiting on containers; each
  # deployable's own seam against real containers; and the one path through all of them. Sharding
  # further would pay the image pulls and the Spring contexts per shard (research note, section 7).
  domain:
    name: An unbalanced Entry is refused, and an unmapped refusal will not compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Every job configures this identically so they share one ~/.m2 cache entry.
          cache: maven

      - name: Every module compiles, and the rules that need no database hold
        run: ./mvnw -B --no-transfer-progress verify -DskipITs

      # The summary job is what turns the other jobs' reports into the claims, so it is tested too.
      - name: The script that ticks the claims is itself tested
        run: python3 -m unittest discover -s .github/scripts

  invariants:
    name: A cross-tenant reference is refused, a Constrained Account never goes negative, and an Entry is applied once
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The runner ships PostgreSQL 16, disabled by default, and it stays that way: Testcontainers
      # starts the images the test-support singletons name -- the tags docker compose uses -- so CI
      # exercises what a developer gets locally. One singleton per container for each module's suite;
      # withReuse is documented as unsuited to CI.
      #
      # The context cache is the cost that grows without bound as the suite grows (ADR-0012, research
      # note section 5): one context per deployable is the rule, so CI logs every context it builds.
      # bash, not the default shell, for pipefail: without it the pipe into tee would swallow a
      # failing suite.
      - name: Each deployable at its own seam, against real Postgres, Kafka and Redis, one Spring context each
        shell: bash
        run: >-
          ./mvnw -B --no-transfer-progress verify
          -Dlogging.level.org.springframework.test.context.cache=DEBUG
          | tee suite.log

      # The claim the step name makes: each module's suite built one context, not one per test class.
      # `size` is the number of distinct context configurations and `missCount` the number actually
      # built; each module's last line should read 1 and 1.
      - name: One Spring context per deployable
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo '### The Spring context cache at the end of each module'"'"'s suite'
            echo '```'
            grep -o 'DefaultContextCache@.*\]' suite.log || echo 'no cache statistics logged'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The reports, and the claim table they are checked against
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: invariants-reports
          path: |
            */target/*-reports/
            nostro-api-service/target/claims.tsv
          if-no-files-found: error

  system:
    name: One Entry crosses every service, and no Tenant can see or reference another's money
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The same command a stranger runs. The images build the reactor themselves.
      - name: docker compose up, and wait for every healthcheck
        run: docker compose up --build --detach --wait --wait-timeout 600

      # The one end-to-end test (ADR-0012), over HTTP against the stack just started.
      - name: The end-to-end path and the isolation test, through the API, the relay, Kafka and the projection
        run: ./mvnw -B --no-transfer-progress -Pe2e -pl nostro-system-test verify

      - name: What every service said, if anything failed
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: The reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: system-reports
          path: nostro-system-test/target/*-reports/
          if-no-files-found: error

      - name: docker compose down
        if: ${{ always() }}
        run: docker compose down --volumes

  # Runs even when a suite failed, so the summary says which claim broke -- but not when the run was
  # cancelled by a newer push, where there is nothing to report.
  claims:
    name: Every claim in the README, ticked from the reports
    needs: [invariants, system]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: reports

      - name: The claims, ticked from the reports
        run: |
          python3 .github/scripts/claim-summary.py \
            reports/invariants-reports/nostro-api-service/target/claims.tsv \
            reports \
            >> "$GITHUB_STEP_SUMMARY"
