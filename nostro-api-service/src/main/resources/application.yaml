spring:
  application:
    name: nostro-api
  threads:
    virtual:
      enabled: true

  # The request path connects as nostro_app: not the owner, no BYPASSRLS, and holding only the
  # grants the migration gives it. Connecting as anything else silently bypasses every policy
  # (docs/research/rls-pooling.md section 3).
  datasource:
    url: ${NOSTRO_DB_URL:jdbc:postgresql://localhost:5432/nostro}
    username: nostro_app
    password: ${NOSTRO_APP_PASSWORD}
    hikari:
      # Multi-row VALUES for batched Posting inserts (docs/research/hibernate-vs-the-schema.md section 7).
      data-source-properties:
        reWriteBatchedInserts: true

  # Migrations run as the owner over the direct connection; they create the roles above.
  flyway:
    url: ${NOSTRO_DB_URL:jdbc:postgresql://localhost:5432/nostro}
    user: ${NOSTRO_DB_OWNER:nostro}
    password: ${NOSTRO_DB_OWNER_PASSWORD}
    placeholders:
      app_password: ${NOSTRO_APP_PASSWORD}
      control_password: ${NOSTRO_CONTROL_PASSWORD}

  # Every refusal is application/problem+json (ADR-0014), including the framework's own;
  # ProblemAdvice types them and LedgerRefusals maps the domain's outcomes.
  mvc:
    problemdetails:
      enabled: true

  jpa:
    # Off: a lazy load during response serialisation would run after COMMIT, on a connection with
    # no Tenant, and under fail-closed policies return an empty collection rather than an error.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Explicit, not defaulted: on ORM 7 a StatelessSession uses the second-level cache by default,
      # and a cached entity outlives the Tenant context that authorised loading it (ADR-0013).
      hibernate.cache.use_second_level_cache: false
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true

# Staff tokens are HS256-signed with a secret that lives only in the environment (ADR-0006).
# Short-lived: a token cannot be revoked, the staff user behind it can, and the row is re-read on
# every request.
nostro:
  auth:
    jwt-secret: ${NOSTRO_JWT_SECRET}
    jwt-ttl: 15m
    # The control plane's bootstrap credential (ADR-0015): nc_ followed by at least 32 bytes. Not a
    # row, because it is what creates the first Tenant.
    control-key: ${NOSTRO_CONTROL_KEY}

  # The control plane connects as nostro_control, over a pool of its own: the one surface that
  # legitimately writes across Tenants, kept off the request path's role (ADR-0015).
  control:
    datasource:
      url: ${spring.datasource.url}
      username: nostro_control
      password: ${NOSTRO_CONTROL_PASSWORD}
    seed-demo-tenants: ${NOSTRO_SEED_DEMO_TENANTS:false}

# The OpenAPI document, generated from the code and never hand-maintained: /v3/api-docs,
# its YAML form at /v3/api-docs.yaml, and the UI at /swagger-ui.html.
springdoc:
  default-produces-media-type: application/json
  writer-with-order-by-keys: true
