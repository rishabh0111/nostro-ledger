spring:
  # For Boot's own executors. The gRPC server ignores this; ProjectionConfiguration gives it virtual threads itself.
  threads:
    virtual:
      enabled: true

  application:
    name: nostro-projection

  # The projection's own database, never the ledger's (ADR-0008), as nostro_projection: not the
  # owner, no BYPASSRLS, and holding only the grants its migration gives it.
  datasource:
    url: ${NOSTRO_PROJECTION_DB_URL:jdbc:postgresql://localhost:5433/nostro_projection}
    username: nostro_projection
    password: ${NOSTRO_PROJECTION_PASSWORD}

  # Migrations run as this database's owner and create the role above.
  flyway:
    url: ${NOSTRO_PROJECTION_DB_URL:jdbc:postgresql://localhost:5433/nostro_projection}
    user: ${NOSTRO_PROJECTION_DB_OWNER:nostro}
    password: ${NOSTRO_PROJECTION_DB_OWNER_PASSWORD}
    placeholders:
      projection_password: ${NOSTRO_PROJECTION_PASSWORD}

  # gRPC on 9090, published to nothing beyond the compose network: the Tenant in the call's
  # metadata is trusted because only the API service can reach this port
  # (docs/research/grpc-and-multi-module-layout.md section 6).
  grpc:
    server:
      port: ${NOSTRO_PROJECTION_GRPC_PORT:9090}

nostro:
  projection:
    kafka:
      bootstrap-servers: ${NOSTRO_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    balance:
      # The server's cap on a read waiting for its minimum Position (ADR-0007). An estimate.
      max-wait: 1s
